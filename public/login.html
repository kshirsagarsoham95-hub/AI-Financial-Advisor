<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | AI Financial Advisor</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">


    <div class="login-card">


        <!-- LOGO -->

        <div class="login-logo">
            ₹
        </div>


        <!-- HEADING -->

        <h1>
            Welcome Back
        </h1>


        <p class="login-subtitle">
            Sign in to your AI Financial Advisor
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- OPTIONS -->

            <div class="login-options">


                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <a href="#">
                    Forgot password?
                </a>


            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit">
                Sign In
            </button>


        </form>


        <!-- MESSAGE -->

        <p id="loginMessage"></p>


        <!-- DIVIDER -->

        <div class="divider">

            <span>
                OR
            </span>

        </div>


        <!-- SIGN UP -->

        <p class="signup-text">

            Don't have an account?

            <a href="#">
                Create Account
            </a>

        </p>


    </div>


    <script src="login.js"></script>

</body>

</html>
