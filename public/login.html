<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Register | FinAdvisor AI Wealth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>₹</text></svg>">
</head>
<body class="login-body">

    <!-- DYNAMIC AMBIENT BACKGROUND -->
    <div class="ambient-background" aria-hidden="true">
        <div class="ambient-grid"></div>
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
        <div class="ambient-orb orb-4"></div>
    </div>

    <div class="login-glass-card">
        <!-- BRAND ICON -->
        <div class="login-emblem">₹</div>

        <!-- HEADINGS -->
        <h1 class="login-heading">FinAdvisor AI</h1>
        <p class="login-subhead">Autonomous Financial Intelligence & Advisory</p>

        <!-- AUTH TABS -->
        <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab-btn active" id="tabSignIn" role="tab" aria-selected="true">Sign In</button>
            <button type="button" class="auth-tab-btn" id="tabSignUp" role="tab" aria-selected="false">Create Account</button>
        </div>

        <!-- DEMO BADGES (visible on Sign In) -->
        <div class="demo-selector-group" id="demoBadge" style="margin-bottom: 20px; display: flex; gap: 8px;">
            <button type="button" class="btn-preset-credential" id="demoClientBtn" style="flex: 1; padding: 10px; background: rgba(0, 180, 255, 0.08); border: 1px solid rgba(0, 180, 255, 0.3); border-radius: var(--radius-sm); color: var(--neon); font-size: 12px; cursor: pointer; text-align: left; transition: all 0.2s ease;">
                <div style="font-weight: 700;">👤 Client Mode</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">client@finadvisor.ai</div>
            </button>
            <button type="button" class="btn-preset-credential" id="demoAdminBtn" style="flex: 1; padding: 10px; background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: var(--radius-sm); color: #fbbf24; font-size: 12px; cursor: pointer; text-align: left; transition: all 0.2s ease;">
                <div style="font-weight: 700;">👑 Admin Mode</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">admin@finadvisor.ai</div>
            </button>
        </div>

        <!-- SIGN IN FORM -->
        <form id="loginForm" autocomplete="on">
            <div class="input-stacked">
                <label for="email">Account Email</label>
                <div class="input-box">
                    <input type="email" id="email" class="custom-input no-prefix" placeholder="client@wealth.com" required value="client@finadvisor.ai">
                </div>
            </div>

            <div class="input-stacked">
                <label for="password">Password</label>
                <div class="input-box">
                    <input type="password" id="password" class="custom-input no-prefix" placeholder="••••••••" required value="password123">
                </div>
            </div>

            <button type="submit" class="btn-primary btn-full" id="btnLogin">
                <span>Access Advisory Suite</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

            <div class="auth-switch-prompt">
                Don't have an account? <a href="#" id="linkToSignUp">Create one now</a>
            </div>
        </form>

        <!-- CREATE ACCOUNT FORM (initially hidden) -->
        <form id="registerForm" autocomplete="on" style="display: none;">
            <div class="input-stacked">
                <label for="regName">Full Name</label>
                <div class="input-box">
                    <input type="text" id="regName" class="custom-input no-prefix" placeholder="e.g. Alex Morgan" required>
                </div>
            </div>

            <div class="input-stacked">
                <label for="regEmail">Email Address</label>
                <div class="input-box">
                    <input type="email" id="regEmail" class="custom-input no-prefix" placeholder="alex@example.com" required>
                </div>
            </div>

            <div class="input-stacked">
                <label for="regPassword">Password</label>
                <div class="input-box">
                    <input type="password" id="regPassword" class="custom-input no-prefix" placeholder="At least 6 characters" minlength="6" required>
                </div>
            </div>

            <div class="input-stacked">
                <label for="regConfirmPassword">Confirm Password</label>
                <div class="input-box">
                    <input type="password" id="regConfirmPassword" class="custom-input no-prefix" placeholder="Re-enter password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn-primary btn-full" id="btnRegister">
                <span>Create Account & Enter</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

            <div class="auth-switch-prompt">
                Already registered? <a href="#" id="linkToSignIn">Sign In to your account</a>
            </div>
        </form>

        <div class="auth-status-msg" id="authMessage"></div>
    </div>

    <script src="login.js"></script>
</body>
</html>
