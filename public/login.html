<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FinAdvisor AI Wealth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>₹</text></svg>">
</head>
<body class="login-body">

    <!-- DYNAMIC AMBIENT BACKGROUND -->
    <div class="ambient-background" aria-hidden="true">
        <div class="ambient-grid"></div>
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
        <div class="ambient-orb orb-4"></div>
    </div>

    <div class="login-glass-card">
        <!-- BRAND ICON -->
        <div class="login-emblem">₹</div>

        <!-- HEADINGS -->
        <h1 class="login-heading">FinAdvisor AI</h1>
        <p class="login-subhead">Autonomous Financial Intelligence & Advisory</p>

        <!-- DEMO BADGE -->
        <div class="demo-credentials-badge">
            <strong>Interactive Demo Mode:</strong> Enter any email and password, or click below to fill demo credentials.
        </div>

        <!-- FORM -->
        <form id="loginForm" autocomplete="on">
            <div class="input-stacked">
                <label for="email">Account Email</label>
                <div class="input-box">
                    <input type="email" id="email" class="custom-input no-prefix" placeholder="client@wealth.com" required value="client@finadvisor.ai">
                </div>
            </div>

            <div class="input-stacked">
                <label for="password">Password</label>
                <div class="input-box">
                    <input type="password" id="password" class="custom-input no-prefix" placeholder="••••••••" required value="password123">
                </div>
            </div>

            <button type="submit" class="btn-primary btn-full" id="btnLogin">
                <span>Access Advisory Suite</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="auth-status-msg" id="loginMessage"></div>
    </div>

    <script src="login.js"></script>
</body>
</html>
